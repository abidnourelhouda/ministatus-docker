
name: Docker CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

env:
  IMAGE: ministatus

jobs:
  build-scan:
    name: Build, Lint et Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Vérification du Dockerfile
      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # 3. Construction de l'image Docker
      - name: Build de l'image
        run: |
          docker build \
            --build-arg APP_VERSION=ci \
            -t ${{ env.IMAGE }}:ci \
            .

      # 4. Exécution des tests unitaires
      - name: Tests dans le conteneur
        run: |
          docker run --rm ${{ env.IMAGE }}:ci python -m unittest -v

      # 5. Vérification de l'image construite
      - name: Vérification de l'image Docker
        run: |
          docker image inspect ${{ env.IMAGE }}:ci

      # 6. Affichage de la version de l'application
      - name: Vérification de la version
        run: |
          docker run --rm ${{ env.IMAGE }}:ci python --version

      
      - name: Rapport Trivy (JSON)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Rapport Trivy (HTML)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: template
          template: "@/contrib/html.tpl"
          output: trivy-report.html
          exit-code: "0"

      - name: Résumé dans la page du run
        if: always()
        run: |
          echo "### Rapport Trivy" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy-report.json ]; then
            for s in CRITICAL HIGH MEDIUM; do
              n=$(jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$s\")] | length" trivy-report.json)
              echo "- $s : $n" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "Rapport JSON indisponible." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-report.*
          if-no-files-found: warn

      - name: Quality gate (HIGH et CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"
      
   
